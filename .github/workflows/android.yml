# Builds the Android APK. Every run uploads it as the `lexicon-apk` artifact; a `v*` tag also
# publishes it on the repository's Releases page.
name: Android APK

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Rust for Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Build liblexicon.so
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a --platform 26 -o android/app/src/main/jniLibs build --release -p lexicon-android
          ls -la android/app/src/main/jniLibs/arm64-v8a

      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF#refs/tags/v}"; else name="$base-${GITHUB_SHA::7}"; fi
          echo "LEXICON_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "LEXICON_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Lexicon-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lexicon-apk
          path: Lexicon-*.apk

      # The newest build of a branch push, always at
      # https://github.com/<owner>/<repo>/releases/download/latest/Lexicon.apk
      - name: Publish latest build
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Lexicon-*.apk Lexicon.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Lexicon.apk --target "$GITHUB_SHA" --prerelease \
            --title "Lexicon — последняя сборка (${{ steps.version.outputs.name }})" \
            --notes "Последняя сборка Lexicon для Android (arm64, Android 8.0+). Скачайте Lexicon.apk на телефон и откройте; разрешите установку из этого источника, когда телефон спросит."

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Lexicon-*.apk --title "Lexicon $GITHUB_REF_NAME" --notes "Lexicon for Android (arm64). Install the APK on the phone; allow installing from this source when asked."
